name: Lahn-Infection Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.gd'
      - '**/*.tscn'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/godot-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Godot project
        id: project
        shell: bash
        run: |
          set -e
          PROJECT_FILE=$(find . -name project.godot -not -path './.git/*' | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo 'No project.godot found.'
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Godot project: $PROJECT_DIR"

      - name: Install Godot 4.6.1 and export templates
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.1.stable/"
          godot --version

      - name: Ensure Android export preset
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -f export_presets.cfg ]; then
            cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Lahn-Infection-debug.apk"
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          package/unique_name="de.matze.lahninfection"
          package/name="Lahn-Infection"
          version/code=1
          version/name="0.1.0"
          screen/immersive_mode=true
          EOF
          fi

      - name: Import project
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: godot --headless --editor --quit-after 10 || true

      - name: Export APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          mkdir -p build
          godot --headless --export-debug Android build/Lahn-Infection-debug.apk
          test -s build/Lahn-Infection-debug.apk
          ls -lh build/Lahn-Infection-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lahn-Infection-Android-APK
          path: ${{ steps.project.outputs.dir }}/build/Lahn-Infection-debug.apk
          if-no-files-found: error
          retention-days: 14
