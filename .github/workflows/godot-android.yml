name: Lahn-Infection Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'LahnInfectionGodot/**'
      - '.github/workflows/godot-android.yml'

permissions:
  contents: read

env:
  PROJECT_DIR: LahnInfectionGodot

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify canonical project
        shell: bash
        run: |
          set -e
          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/main.tscn"
          grep -q 'res://scripts/main.gd' "$PROJECT_DIR/main.tscn"
          grep -q 'LAHN-INFECTION' "$PROJECT_DIR/scripts/mobile_hud.gd"
          grep -q 'textures/vram_compression/import_etc2_astc=true' "$PROJECT_DIR/project.godot"
          echo "Building ONLY: $PROJECT_DIR"
          sha256sum "$PROJECT_DIR/scripts/main.gd" "$PROJECT_DIR/scripts/mobile_hud.gd" "$PROJECT_DIR/project.godot"
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          adb start-server
      - name: Install Godot 4.6.1 and export templates
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.1.stable/"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          godot --version
      - name: Validate canonical project
        shell: bash
        working-directory: LahnInfectionGodot
        run: godot --headless --editor --quit-after 10
      - name: Export canonical APK
        shell: bash
        working-directory: LahnInfectionGodot
        run: |
          set -e
          adb start-server
          rm -rf build
          mkdir -p build
          godot --headless --path . --export-debug Android build/Lahn-Infection-Alpha-0.2-Build20.apk
          test -s build/Lahn-Infection-Alpha-0.2-Build20.apk
          sha256sum build/Lahn-Infection-Alpha-0.2-Build20.apk
          ls -lh build/Lahn-Infection-Alpha-0.2-Build20.apk
      - name: Upload canonical APK
        uses: actions/upload-artifact@v4
        with:
          name: Lahn-Infection-Alpha-0.2-Build20-CANONICAL
          path: LahnInfectionGodot/build/Lahn-Infection-Alpha-0.2-Build20.apk
          if-no-files-found: error
          retention-days: 14
