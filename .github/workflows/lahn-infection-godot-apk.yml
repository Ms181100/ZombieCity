name: Lahn-Infection Godot APK

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK bauen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Java 17 fuer Godot einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-Werkzeuge einrichten
        uses: android-actions/setup-android@v3

      - name: Passende Android-SDK-Pakete installieren
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          test -f "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          java -version

      - name: Android-Debugsignatur erzeugen
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Lahn Infection,C=DE" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Godot Android-Pfade festlegen
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Godot-Projekt als APK exportieren
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./LahnInfectionGodot
          presets_to_export: Android
          export_debug: true
          cache: true
          verbose: true

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Lahn-Infection-Android-APK
          path: ${{ steps.export.outputs.build_directory }}/**/*.apk
          if-no-files-found: error
          retention-days: 14
