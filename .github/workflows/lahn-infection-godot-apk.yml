name: Lahn-Infection Godot APK

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK bauen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Android-Werkzeuge einrichten
        uses: android-actions/setup-android@v3

      - name: Passende Android-SDK-Pakete installieren
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Godot-Projekt als APK exportieren
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./LahnInfectionGodot
          presets_to_export: Android
          export_debug: true
          cache: true

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Lahn-Infection-Android-APK
          path: ${{ steps.export.outputs.build_directory }}/**/*.apk
          if-no-files-found: error
          retention-days: 14
