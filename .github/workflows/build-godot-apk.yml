name: Zombie City 3D APK
on:
  workflow_dispatch:
  push:
    paths:
      - "ZombieCity3D/**"
      - ".github/workflows/build-godot-apk.yml"
jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Export templates vorbereiten
        run: mkdir -p ~/.local/share/godot/export_templates && mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable || true
      - name: Android Java SDK konfigurieren
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"\n' > ~/.config/godot/editor_settings-4.7.tres
      - name: APK exportieren
        working-directory: ZombieCity3D
        run: mkdir -p build && godot --headless --export-debug Android build/ZombieCity3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZombieCity3D-APK
          path: ZombieCity3D/build/ZombieCity3D.apk
          if-no-files-found: error
